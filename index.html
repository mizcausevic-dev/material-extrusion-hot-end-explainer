<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material-Extrusion Hot End. Anatomy Motion Explainer</title>
<meta name="description" content="Deterministic 34-second, 1020-frame code-driven anatomy explainer of a material-extrusion hot end. Conceptual, qualitative, no operating settings.">
<style>
:root{--bg:#0B1019;--panel:#111A29;--panel2:#162133;--struct:#344257;--struct2:#223047;--ink:#E8EEF6;--mut:#93A4BC;--cyan:#00E5FF;--gold:#FFD166;--violet:#9D4EDD;--bone:#F4F1EA;--danger:#FF5A76;--line:#263750}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#16283f 0,transparent 60%),var(--bg);color:var(--ink);font-family:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--cyan)}
header{max-width:1240px;margin:0 auto;padding:28px 20px 10px}
.kicker{color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;font-size:11px}
h1{font-size:clamp(30px,5vw,54px);line-height:.98;margin:10px 0 10px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--cyan)}
.sub{color:var(--mut);max-width:860px;line-height:1.55;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:#0e1624;border-radius:999px;padding:6px 10px;font-size:11px;color:var(--mut)}
.chip b{color:var(--bone);font-weight:600}.chip.warn b{color:var(--gold)}
main{max-width:1240px;margin:0 auto;padding:14px 20px 34px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 14px}
.chain .step{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--mut)}
.chain .step.on{border-color:var(--cyan);color:#fff;box-shadow:0 0 0 1px #00e5ff33,0 0 22px #00e5ff22}
.chain .step.done{border-color:#3d5a74;color:var(--bone)}
.chain .arr{color:#4d647f}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,#0d1522,#0a0f18);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stageTop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:#0c1421}
.stageTop .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.stageTop .f{color:var(--cyan)}
svg#scene{display:block;width:100%;height:auto;background:#0B1019}
.controls{padding:14px;border-top:1px solid var(--line);background:#0c1421}
.controls .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:#18263c;color:var(--ink);border:1px solid #2b405e;border-radius:10px;padding:9px 13px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--cyan)}button.primary{background:var(--cyan);color:#031018;border-color:var(--cyan);font-weight:700}
input[type=range]{flex:1;min-width:180px;accent-color:var(--cyan)}
.readout{font-size:12px;color:var(--mut)}.readout b{color:#fff}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
@media(max-width:700px){.phases{grid-template-columns:1fr 1fr}}
.phases button{text-align:left;font-size:11px;line-height:1.35;color:var(--mut)}
.phases button.on{border-color:var(--cyan);color:#fff;background:#10283a}
.phases button b{display:block;color:var(--bone);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;color:var(--bone)}
.card p,.card li{color:var(--mut);font-size:13px;line-height:1.6}
.card ul{margin:8px 0;padding-left:18px}
#phaseTitle{font-size:19px;color:#fff;margin:0 0 6px;line-height:1.2}
#phaseBody{color:var(--mut);font-size:13.5px;line-height:1.65}
.cause{border-left:3px solid var(--cyan);padding:8px 10px;background:#0d1b2a;border-radius:0 10px 10px 0;color:#cfe9f2;font-size:12.5px;line-height:1.55;margin-top:12px}
.legend{display:grid;gap:8px;font-size:12px;color:var(--mut)}
.sw{display:inline-block;width:22px;height:10px;border-radius:3px;vertical-align:middle;margin-right:8px}
.dashline{display:inline-block;width:22px;border-top:3px dashed var(--violet);vertical-align:middle;margin-right:8px}
.hatch{display:inline-block;width:22px;height:10px;border-radius:3px;vertical-align:middle;margin-right:8px;background:repeating-linear-gradient(45deg,#FFD166 0 3px,#5a4512 3px 6px)}
.insetBox{border:1.5px dashed var(--violet);border-radius:12px;padding:10px;background:#140f24}
.insetBox .tag{color:#d6b8ff;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.conserve{display:grid;gap:7px;font-size:12px;color:var(--mut)}
.bar{height:9px;border-radius:99px;background:#1b2a40;overflow:hidden}.bar i{display:block;height:100%}
.safe{border-color:#5a2b3a;background:#1a1118}.safe h2{color:#ffb3c0}
details{margin-top:14px}summary{cursor:pointer;color:var(--cyan);font-size:13px}
footer{max-width:1240px;margin:0 auto;padding:0 20px 36px;color:#6f829c;font-size:12px;line-height:1.7}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
PLACEHOLDER_BODY
</body>
</html>
